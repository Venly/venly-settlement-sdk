            $ref: '#/components/schemas/TokenBalance'
        amlStatus:
          $ref: '#/components/schemas/AmlStatus'
    WalletListResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/Wallet'
          pagination:
            $ref: '#/components/schemas/Pagination'
    VirtualBankAccount:
      type: object
      description: 'Virtual bank account for receiving payments. EUR_SEPA accounts return iban/bic.

        '
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        bankAccountType:
          $ref: '#/components/schemas/BankAccountType'
        name:
          type: string
          description: Display name for the bank account
        status:
          $ref: '#/components/schemas/VirtualBankAccountStatus'
        currency:
          $ref: '#/components/schemas/FiatCurrency'
          description: Fiat currency this account receives
        targetCryptocurrency:
          $ref: '#/components/schemas/Cryptocurrency'
          description: Cryptocurrency that incoming fiat is converted to
        iban:
          type: string
          description: IBAN for EUR_SEPA accounts
          example: DE89370400440532013000
        bic:
          type: string
          description: BIC/SWIFT code for EUR_SEPA accounts
          example: DEUTDEDB
        bankName:
          type: string
          description: Name of the bank
        beneficiaryName:
          type: string
          description: Name of the account beneficiary
        referenceCode:
          type: string
          description: Unique reference code to include in payment transfers
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateVirtualBankAccountRequest:
      type: object
      description: 'Request to create a virtual bank account. The backend provisions the appropriate

        bank account type based on inCurrency (e.g. EUR -> EUR_SEPA).

        '
      required:
      - name
      - inCurrency
      - targetCryptocurrency
      - idempotencyKey
      properties:
        name:
          type: string
          maxLength: 255
          description: Display name for the bank account
        inCurrency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Fiat currency to receive (ISO 4217). Determines the bank account type (EUR -> EUR_SEPA)
        targetCryptocurrency:
          type: string
          pattern: ^[A-Za-z0-9]{2,10}$
          description: Cryptocurrency to convert incoming fiat payments to (e.g. USDC)
        idempotencyKey:
          type: string
          maxLength: 255
          description: Unique key to prevent duplicate operations on retry
      example:
        name: My EUR Deposit Account
        inCurrency: EUR
        targetCryptocurrency: USDC
        idempotencyKey: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    SingleVirtualBankAccountResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          result:
            $ref: '#/components/schemas/VirtualBankAccount'
    VirtualBankAccountListResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/VirtualBankAccount'
          pagination:
            $ref: '#/components/schemas/Pagination'
    PaymentSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PaymentSessionStatus'
        inAmount:
          type: number
          description: Fiat amount to be paid in
        inCurrency:
          type: string
          description: Fiat currency of the incoming payment
        outCryptocurrency:
          type: string
          description: Cryptocurrency the incoming fiat is converted to
        paymentUrl:
          type: string
          format: uri
          description: Hosted URL to redirect the payer to
        externalRef:
          type: string
        walletId:
          type: string
          format: uuid
        blockchainTxId:
          type: string
          nullable: true
        cancellable:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
        idempotencyKey:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePayInSessionRequest:
      type: object
      required:
      - inAmount
      - inCurrency
      - outCryptocurrency
      - callbackUrl
      - idempotencyKey
      properties:
        inAmount:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
          description: Fiat amount to pay in
        inCurrency:
          type: string
          minLength: 1
          description: Fiat currency of the incoming payment (e.g. EUR)
        outCryptocurrency:
          type: string
          minLength: 1
          description: Cryptocurrency to convert the incoming fiat to (e.g. USDC)
        callbackUrl:
          type: string
          pattern: ^https://.*
          description: HTTPS URL to receive payment status callbacks
        successRedirectUrl:
          type: string
          description: URL to redirect the user to on successful payment
        failureRedirectUrl:
          type: string
          description: URL to redirect the user to on failed payment
        externalRef:
          type: string
          maxLength: 255
          description: Optional external reference
        idempotencyKey:
          type: string
          format: uuid
          description: Unique UUID key to prevent duplicate operations on retry
        metadata:
          type: object
          additionalProperties:
            type: string
    SinglePaymentSessionResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          result:
            $ref: '#/components/schemas/PaymentSession'
    PaymentExecution:
      type: object
      description: A single on-chain settlement attempt for a payment request
      properties:
        id:
          type: string
          format: uuid
        walletPairId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/PaymentExecutionType'
        chain:
          $ref: '#/components/schemas/BlockchainNetwork'
        asset:
          type: string
        amount:
          type: number
        exchangeRate:
          type: number
        status:
          $ref: '#/components/schemas/PaymentExecutionStatus'
        transactionHash:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaymentRequestAmount:
      type: object
      description: Payment amount, expressed in both the request fiat currency and the settled crypto
        amount. `amount` is the request's current value; `originalAmount` preserves the value at creation
        time (the two can diverge after an adjustment).
      properties:
        fiat:
          type: number
          description: Amount in the request `currency` (e.g. USD)
        crypto:
          type: string
          description: Settled crypto amount as a decimal string (e.g. USDC)
    PaymentRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/PaymentRequestAmount'
        originalAmount:
          $ref: '#/components/schemas/PaymentRequestAmount'
        settlementAmount:
          $ref: '#/components/schemas/PaymentRequestAmount'
        settledAmount:
          $ref: '#/components/schemas/PaymentRequestAmount'
        shortfallAmount:
          $ref: '#/components/schemas/PaymentRequestAmount'
        currency:
          type: string
        externalId:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/PaymentRequestStatus'
        settledAt:
          type: string
          format: date-time
          description: When settlement completed (terminal SETTLED / SETTLED_WITH_SHORTFALL)
        reversalReason:
          $ref: '#/components/schemas/ReversalReason'
        reversalDescription:
          type: string
          description: Optional free-text reason supplied on reversal
        reversedAt:
          type: string
          format: date-time
          description: When the reversal completed
        executions:
          type: array
          items:
            $ref: '#/components/schemas/PaymentExecution'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePaymentRequestInput:
      type: object
      required:
      - amount
      - currency
      - idempotencyKey
      properties:
        amount:
          type: number
          description: Payment amount
        currency:
          type: string
          minLength: 1
          description: Currency code (e.g. EUR, USD)
        externalId:
          type: string
          description: Optional external reference ID
        description:
          type: string
          description: Optional payment description
        idempotencyKey:
          type: string
          minLength: 1
          description: Unique key to prevent duplicate operations on retry
    CardProviderReference:
      type: object
      required:
      - type
      - referenceId
      properties:
        type:
          type: string
          minLength: 1
          description: Card provider type identifier (case-sensitive)
        referenceId:
          type: string
          minLength: 1
          description: Unique reference ID from the card provider
    CardProviderPaymentRequestInput:
      type: object
      required:
      - cardProviderReference
      - paymentRequest
      properties:
        cardProviderReference:
          $ref: '#/components/schemas/CardProviderReference'
        paymentRequest:
          $ref: '#/components/schemas/CreatePaymentRequestInput'
    SinglePaymentRequestResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          result:
            $ref: '#/components/schemas/PaymentRequest'
    PaymentRequestReference:
      type: object
      required:
      - cardProviderReference
      - externalId
      description: Identifies a payment request by the card-provider reference of its account plus the
        request's `externalId` — used by the "by reference" settle/reverse endpoints.
      properties:
        cardProviderReference:
          $ref: '#/components/schemas/CardProviderReference'
        externalId:
          type: string
          minLength: 1
          description: The payment request's externalId (e.g. the card-provider TID)
    SettlePaymentRequestInput:
      type: object
      required:
      - amount
      - currency
      - idempotencyKey
      properties:
        amount:
          type: number
          description: Final settlement amount, in the authorized fiat currency
        currency:
          type: string
          maxLength: 10
          description: Must match the authorized currency
        idempotencyKey:
          type: string
          maxLength: 255
          description: Unique key to prevent duplicate operations on retry
    SettlePaymentRequestByReferenceInput:
      type: object
      required:
      - paymentRequestReference
      - amount
      - currency
      - idempotencyKey
      description: Settles a payment request identified by its card-provider reference.
      properties:
        paymentRequestReference:
          $ref: '#/components/schemas/PaymentRequestReference'
        amount:
          type: number
          description: Final settlement amount, in the authorized fiat currency
        currency:
          type: string
          minLength: 1
          description: Must match the authorized currency
        idempotencyKey:
          type: string
          minLength: 1
          description: Unique key to prevent duplicate operations on retry
    ReversePaymentRequestInput:
      type: object
      required:
      - reason
      - idempotencyKey
      properties:
        reason:
          $ref: '#/components/schemas/ReversalReason'
        description:
          type: string
          maxLength: 1000
          description: Optional free-text reason for the reversal
        idempotencyKey:
          type: string
          maxLength: 255
          description: Unique key to prevent duplicate operations on retry
    ReversePaymentRequestByReferenceInput:
      type: object
      required:
      - paymentRequestReference
      - reason
      - idempotencyKey
      description: Reverses a payment request identified by its card-provider reference.
      properties:
        paymentRequestReference:
          $ref: '#/components/schemas/PaymentRequestReference'
        reason:
          $ref: '#/components/schemas/ReversalReason'
        description:
          type: string
          maxLength: 1000
          description: Optional free-text reason for the reversal
        idempotencyKey:
          type: string
          maxLength: 255
          description: Unique key to prevent duplicate operations on retry
    UpdatePaymentRequestInput:
      type: object
      required:
      - amount
      - currency
      - idempotencyKey
      description: Sets a new absolute authorized amount on a payment request. A lower amount releases
        the difference from escrow back to the account wallet; a higher amount pulls the additional funds
        from the account wallet into escrow.
      properties:
        amount:
          type: number
          minimum: 0
          description: New absolute authorized amount, in the authorized fiat currency
        currency:
          type: string
          minLength: 1
          description: Must match the authorized currency
        idempotencyKey:
          type: string
          maxLength: 255
          description: Unique key to prevent duplicate operations on retry
    FiatOrigin:
