      summary: Update the authorized amount of a payment request
      description: 'Sets a new absolute authorized `amount` on a payment request. The execution that runs
        depends on how the new amount compares to the current one:


        - A lower amount releases the difference from escrow back to the account wallet via an `AUTHORIZATION_ADJUSTMENT`
        execution.

        - A higher amount pulls the additional funds from the account wallet into escrow via an `INCREMENTAL_AUTHORIZATION`
        execution.


        The request keeps `status: RESERVED`, `amount` reflects the new value, and `originalAmount` preserves
        the amount set at creation. Pass a unique `idempotencyKey`.

        '
      operationId: updatePaymentRequest
      parameters:
      - $ref: '#/components/parameters/PaymentRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentRequestInput'
            example:
              amount: 20
              currency: USD
              idempotencyKey: 3fa85f64-5717-4562-b3fc-2c963f66afa6
