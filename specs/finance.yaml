  /accounts/{accountId}/wallets/{walletId}/permits:
    get:
      tags:
      - Permits
      summary: Get permit messages for wallet
      description: 'Retrieves the EIP-712 permit messages a self-custody wallet must sign to grant the
        orchestration wallet an allowance. Returns one entry per supported asset, each with a `supportedAssetId`
        and the `typedData` to sign.


        Sign `typedData` with the wallet **owner''s** key (the signature must recover to `owner`), then
        submit it via POST.


        **Note:** Applies to SELF_CUSTODY companies only — VENLY_MANAGED wallets (and all escrow wallets)
        are permitted automatically by Venly.

        '
      operationId: getPermitMessages
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: List of permit messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitMessageListResponse'
              example:
                success: true
                result:
                - supportedAssetId: aabbccdd-1122-4334-9556-7788990011ab
                  asset: USDC
                  contractAddress: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
                  status: CONFIRMED
                  typedData:
                    types:
                      EIP712Domain:
                      - name: name
                        type: string
                      - name: version
                        type: string
                      - name: chainId
                        type: uint256
                      - name: verifyingContract
                        type: address
                      Permit:
                      - name: owner
                        type: address
                      - name: spender
                        type: address
                      - name: value
                        type: uint256
                      - name: nonce
                        type: uint256
                      - name: deadline
                        type: uint256
                    primaryType: Permit
                    domain:
                      name: USDC
                      version: '2'
                      chainId: 84532
                      verifyingContract: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
                    message:
                      owner: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
                      spender: '0x5B38Da6a701c568545dCfcB03FcB875f56beddC4'
                      value: '115792089237316195423570985008687907853269984665640564039457584007913129639935'
                      nonce: 0
                      deadline: '4102444800'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Permits
      summary: Submit signed permit
      description: 'Submits a signed EIP-712 permit for on-chain execution by the orchestration wallet
        (which pays the gas). The signature **must recover to the wallet `owner`** — otherwise the permit
        settles as `FAILED`.


        Returns HTTP 200 with the permit `status`: `SUBMITTED` while it settles on-chain, then `CONFIRMED`.
        Poll `GET .../permits` for the transition. When all of a wallet''s permits are `CONFIRMED`, the
        wallet becomes `ACTIVE` and can send transfers/payments. Re-submitting an already-confirmed permit
        returns `409`.

        '
      operationId: submitPermit
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/WalletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPermitRequest'
            example:
              supportedAssetId: aabbccdd-1122-4334-9556-7788990011ab
              signature:
                v: '28'
                r: '0x1111111111111111111111111111111111111111111111111111111111111111'
                s: '0x2222222222222222222222222222222222222222222222222222222222222222'
      responses:
        '200':
          description: Permit submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePermitResultResponse'
              example:
                success: true
                result:
                  id: 11aa22bb-33cc-4dd4-9ee5-66ff77aa88bb
                  supportedAssetId: aabbccdd-1122-4334-9556-7788990011ab
                  asset: USDC
                  contractAddress: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
                  status: SUBMITTED
                  permitTxId: 0a9f8e7d-6c5b-4a39-8271-6a5b4c3d2e1f
                  skipped: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accounts/{accountId}/wallets/{walletId}/allowances:
    get:
      tags:
      - Allowances
      summary: Get wallet token allowances
      description: 'Retrieves the current token allowances for a wallet — which tokens have been approved

        for spending by the orchestration wallet and the approved amounts.


        **Note:** Allowances apply to SELF_CUSTODY companies only.

        '
      operationId: getWalletAllowances
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/WalletId'
      - name: asset
        in: query
        description: Filter by a specific asset (e.g. USDC)
        required: false
        schema:
          type: string
        example: USDC
      responses:
        '200':
          description: List of token allowances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceListResponse'
              example:
                success: true
                result:
                - asset:
                    name: USDC
                    contractAddress: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
                    decimals: 6
                  allowance: '100.000000'
                  orchestrationWallet: '0x5B38Da6a701c568545dCfcB03FcB875f56beddC4'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: 'OAuth2 client credentials flow. Token endpoints:

        - Staging: https://login-staging.venly.io/auth/realms/VenlyFinance/protocol/openid-connect/token

        - Production: https://login.venly.io/auth/realms/VenlyFinance/protocol/openid-connect/token

        '
      flows:
        clientCredentials:
          tokenUrl: https://login-staging.venly.io/auth/realms/VenlyFinance/protocol/openid-connect/token
          scopes: {}
  parameters:
    PartyId:
      name: partyId
      in: path
      required: true
      description: Unique party identifier
      schema:
        type: string
        format: uuid
      example: 7e3b9c2a-1f4d-4a8b-9c11-2d6e8f0a1b22
    AccountId:
      name: accountId
      in: path
      required: true
      description: Unique account identifier
      schema:
        type: string
        format: uuid
      example: b2a1f0e9-8c7d-4e3a-9f21-0a1b2c3d4e5f
    PaymentRequestId:
      name: paymentRequestId
      in: path
      required: true
      description: Unique payment request identifier
      schema:
        type: string
        format: uuid
      example: d4e5f6a7-b8c9-4012-8345-6789abcdef01
    WalletId:
      name: walletId
      in: path
      required: true
      description: Unique wallet identifier
      schema:
        type: string
        format: uuid
      example: 9f8e7d6c-5b4a-4938-8271-6a5b4c3d2e1f
    VirtualBankAccountId:
      name: virtualBankAccountId
      in: path
      required: true
      description: Unique virtual bank account identifier
      schema:
        type: string
        format: uuid
      example: 4d5e6f70-8192-4a3b-9c4d-5e6f7081920a
    Page:
      name: page
      in: query
      description: Page number (1-based indexing)
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
      example: 1
    Size:
      name: size
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
      example: 20
    SortOn:
      name: sortOn
      in: query
      description: Field to sort by
      required: false
      schema:
        type: string
        default: createdAt
      example: createdAt
    SortOrder:
      name: sortOrder
      in: query
      description: Sort direction
      required: false
      schema:
        type: string
        default: ASC
        enum:
        - ASC
        - DESC
      example: DESC
  responses:
    BadRequest:
      description: Request validation failed (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            errors:
            - code: invalid-request
              message: The request contains invalid parameters.
    Unauthorized:
      description: Authentication required or failed (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            errors:
            - code: unauthenticated
              message: Please authenticate to perform this action.
    Forbidden:
      description: Caller lacks the required authority/role (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            errors:
            - code: forbidden
              message: You do not have permission to access this resource.
    NotFound:
      description: Resource not found (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            errors:
            - code: account-not-found
              message: The requested resource was not found.
    Conflict:
      description: Resource conflict / optimistic-lock failure (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            errors:
            - code: concurrent-modification
              message: This request has been modified by another user. Please refresh and try again.
    PaymentRequired:
      description: Funds or allowance insufficient to complete the operation (402)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            errors:
            - code: insufficient-funds
              message: The account wallet balance is insufficient to complete this operation.
    UnprocessableEntity:
      description: Idempotency conflict — the key was reused with a different body, or replays an operation
        that originally failed (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            errors:
            - code: idempotency-conflict
              message: This idempotency key was already used with a different request.
    InternalServerError:
      description: Unexpected server error (500)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            errors:
            - code: internal-error
              message: An unexpected error occurred. Please try again later.
  schemas:
    PartyType:
      type: string
      description: Type of party
      enum:
      - INDIVIDUAL
      - ORGANISATION
    PartyStatus:
      type: string
      description: Status of a party
      enum:
      - ACTIVE
      - SUSPENDED
      - BLOCKED
    PartyRoleType:
      type: string
      description: Role type for the party-account relationship
      enum:
      - ACCOUNT_HOLDER
    PartyRoleStatus:
      type: string
      description: Status of a party role
      enum:
      - ACTIVE
      - INACTIVE
    AccountStatus:
      type: string
      description: Status of an account
      enum:
      - ACTIVE
      - SUSPENDED
      - CLOSED
    WalletType:
      type: string
      description: Custody model of the wallet
      enum:
      - VENLY_MANAGED
      - SELF_CUSTODY
    VirtualBankAccountStatus:
      type: string
      description: Status of a virtual bank account
      enum:
      - ACTIVE
      - CLOSED
    BankAccountType:
      type: string
      description: 'Type of bank account, determining the payment rails.

        Currently only EUR_SEPA is provisioned. Future rails (USD_WIRE, USD_ACH, GBP_FPS, …)

        will be added in later releases.

        '
      enum:
      - EUR_SEPA
    BlockchainNetwork:
      type: string
      description: Supported blockchain network
      enum:
      - AVALANCHE
      - BASE
      - POLYGON
    Cryptocurrency:
      type: string
      description: Supported cryptocurrency / stablecoin asset
      enum:
      - USDC
      - EURC
      - USDT
      - USDS
    FiatCurrency:
      type: string
      description: Supported fiat currencies. Virtual bank accounts currently support EUR only.
      enum:
      - EUR
      - GBP
      - USD
    KycStatus:
      type: string
      description: KYC verification status (Individuals & accounts)
      enum:
      - VERIFICATION_PENDING
      - VERIFIED
      - REJECTED
    KybStatus:
      type: string
      description: KYB verification status (Organisations)
      enum:
      - PENDING
      - VERIFIED
      - DENIED
    AmlStatus:
      type: string
      description: AML screening status of a wallet
      enum:
      - PENDING
      - APPROVED
      - REJECTED
    TransferStatus:
      type: string
      description: Status of a transfer
      enum:
      - PENDING
      - COMPLETED
      - FAILED
    PaymentRequestStatus:
      type: string
      description: Status of a payment request
      enum:
      - PENDING
      - RESERVED
      - SETTLING
      - SETTLED
      - SETTLED_WITH_SHORTFALL
      - REVERSING
      - REVERSED
      - FAILED
    PaymentExecutionStatus:
      type: string
      description: Status of a single payment-request execution
      enum:
      - PENDING
      - RESERVED
      - SETTLED
      - REVERSED
      - FAILED
    PaymentExecutionType:
      type: string
      description: The role an execution plays in a payment request's lifecycle.
      enum:
      - AUTHORIZATION
      - INCREMENTAL_AUTHORIZATION
      - AUTHORIZATION_ADJUSTMENT
      - SETTLEMENT
      - SETTLEMENT_OVERAGE
      - REFUND
      - REVERSAL
    ReversalReason:
      type: string
      description: Why a payment request was reversed (recorded for audit).
      enum:
      - CUSTOMER_CANCELLATION
      - MERCHANT_VOID
      - ACQUIRER_FAILURE
      - NETWORK_DECLINE
      - OTHER
    PermitStatus:
      type: string
      description: Status of an EIP-712 permit
      enum:
      - PENDING
      - SUBMITTED
      - CONFIRMED
      - FAILED
    PaymentSessionStatus:
      type: string
      description: Status of a fiat-to-crypto payment session
      enum:
      - CREATED
      - PENDING_PAYMENT
      - PAYMENT_RECEIVED
      - CONVERTING
      - MINTING
      - COMPLETED
      - FAILED
      - EXPIRED
      - CANCELLED
      - REFUNDING
      - REFUNDED
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether the request was successful
    Pagination:
      type: object
      description: Pagination metadata (top-level sibling of `result`)
      properties:
        pageNumber:
          type: integer
          format: int32
          description: Current page number (1-based)
        pageSize:
          type: integer
          format: int32
          description: Number of items per page
        numberOfElements:
          type: integer
          format: int64
          description: Total number of items across all pages
        numberOfPages:
          type: integer
          format: int32
          description: Total number of pages
        hasNextPage:
          type: boolean
          description: Whether there is a next page
        hasPreviousPage:
          type: boolean
          description: Whether there is a previous page
    ErrorResponse:
      type: object
      description: Error response wrapper
      properties:
        success:
          type: boolean
          description: Always false for error responses
          example: false
        errors:
          type: array
          description: List of errors that occurred
          items:
            $ref: '#/components/schemas/ErrorBody'
        result:
          type: object
          nullable: true
          description: Null or omitted when success is false
    ErrorBody:
      type: object
      description: Individual error details
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: invalid-request
        message:
          type: string
          description: Human-readable error message
          example: The request contains invalid parameters.
    Address:
      type: object
      description: Standardized address format used across all endpoints
      properties:
        addressLine1:
          type: string
          maxLength: 255
        addressLine2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postalCode:
          type: string
          maxLength: 20
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 country code
    Party:
      type: object
      description: 'A party represents an Individual or Organisation that can hold accounts.

        The partyType field determines which additional fields are present.

        '
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: string
          description: External reference ID
        partyType:
          $ref: '#/components/schemas/PartyType'
        status:
          $ref: '#/components/schemas/PartyStatus'
        firstName:
          type: string
          description: First name (Individual only)
        lastName:
          type: string
          description: Last name (Individual only)
        kycStatus:
          $ref: '#/components/schemas/KycStatus'
        name:
          type: string
          description: Organisation name (Organisation only)
        vatNumber:
          type: string
          description: VAT number (Organisation only)
        kybStatus:
          $ref: '#/components/schemas/KybStatus'
        address:
          $ref: '#/components/schemas/Address'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Optimistic-locking version, required when updating
    CreatePartyRequest:
      type: object
      required:
      - partyType
      properties:
        partyType:
          $ref: '#/components/schemas/PartyType'
        externalId:
          type: string
          maxLength: 255
          description: Optional external reference ID
        firstName:
          type: string
          maxLength: 100
          description: Required for INDIVIDUAL parties
        lastName:
          type: string
          maxLength: 100
          description: Required for INDIVIDUAL parties
        name:
          type: string
          maxLength: 255
          description: Organisation name. Required for ORGANISATION parties
        vatNumber:
          type: string
          maxLength: 50
          description: VAT number. ORGANISATION parties only
        address:
          $ref: '#/components/schemas/Address'
      example:
        partyType: INDIVIDUAL
        firstName: John
