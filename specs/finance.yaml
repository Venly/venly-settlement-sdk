      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: payoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                properties:
                  success:
                    type: boolean
                    default: true
                  result:
                    $ref: "#/components/schemas/PayoutDto"
        "400":
          description: When the request contains invalid input
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErrorBody"
                  result:
                    type: object
              example:
                success: false
                errors:
                  - code: validation-error
                    message: A descriptive error message
        "401":
          description: When the user is not authorized to access the resource
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErrorBody"
                  result:
                    type: object
              example:
                success: false
                errors:
                  - code: UNAUTHORIZED
                    message: Access is denied.
        "403":
          description: When a user doesn't have proper security authority
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErrorBody"
                  result:
                    type: object
              example:
                success: false
                errors:
                  - code: FORBIDDEN
                    message: User doesn't have proper authority to access this resource
        "404":
          description: When a resource is not found
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErrorBody"
                  result:
                    type: object
              example:
                success: false
                errors:
                  - code: NOT_FOUND
        "405":
          description: When the HttpMethod is not supported
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErrorBody"
                  result:
                    type: object
              example:
                success: false
                errors:
                  - code: METHOD_NOT_SUPPORTED
                    message: HttpMethod is not supported. Supported methods are [..]
        "415":
          description: Usually when the input is not a valid json
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
