        amount:
          type: number
          description: Transfer amount
        description:
          type: string
          description: Optional transfer description
        merchantReference:
          type: string
          description: Optional merchant reference
        idempotencyKey:
          type: string
          minLength: 1
          description: Unique key to prevent duplicate operations on retry
    CreateCryptoTransferInput:
