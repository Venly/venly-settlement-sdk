openapi: 3.1.0
info:
  title: Venly Finance API
  description: "REST API for the Venly Finance platform:\n- Party management (Individuals & Organisations)\n\
    - Account management with party association\n- Wallet balances & token allowances on supported chains\
    \ (Base, Avalanche)\n- Virtual bank account assignment for global payments (EUR SEPA)\n- Fiat-to-crypto\
    \ payment sessions (pay-in)\n- Account-to-account fiat & crypto transfers\n- EIP-2612 permits and\
    \ payment requests\n\n## Authentication\n\nAll endpoints use OAuth2 client credentials. Obtain a token\
    \ first, then include it in every request:\n\n**Step 1 — Get a token:**\n```bash\ncurl -X POST https://login.venly.io/auth/realms/VenlyFinance/protocol/openid-connect/token\
    \ \\\n  -H \"Content-Type: application/x-www-form-urlencoded\" \\\n  -d \"grant_type=client_credentials&client_id={CLIENT_ID}&client_secret={CLIENT_SECRET}\"\
    \n```\n\n**Step 2 — Use the token:**\n```\nAuthorization: Bearer {access_token}\n```\n\nTokens expire\
    \ after **5 minutes**. Implement refresh logic in your client.\n"
  version: 1.1.0
  contact:
    name: Venly Support
    email: support@venly.io
    url: https://docs.venlyfinance.com
  license:
    name: Proprietary
  x-logo:
    url: https://venlyfinance.com/logo.png
  x-security-contact: security@venly.io
servers:
- url: https://api.venlyfinance.com/v1
  description: Production
- url: https://api-staging.venlyfinance.com/v1
  description: Staging
security:
- OAuth2: []
tags:
- name: Parties
  description: Party management (Individuals & Organisations)
- name: Accounts
  description: Account management, party-role associations
- name: Wallets
  description: Blockchain wallet balances
- name: Virtual Bank Accounts
  description: Virtual bank account payment references for global payments
- name: Fiat-to-crypto Payment Sessions
  description: Fiat-to-crypto payment session creation
- name: Payment Requests
  description: Payment request management for card provider integrations
- name: Transfers
  description: Fiat and crypto transfer operations between accounts
- name: Permits
  description: EIP-712 permit signature management for token approvals
- name: Allowances
  description: Token allowance management for wallets
paths:
  /parties:
    get:
      tags:
      - Parties
      summary: List all parties
      description: '**Step 1 of the Finance API Flow**


        Retrieves all parties (Individuals and Organisations) in your system. Parties are the foundation
        of the Finance API - they represent the people or organizations that will hold accounts.


        **Use this endpoint to:**

        - View all registered customers and organizations

        - Search for existing parties before creating accounts

        - Audit party records and their KYC/KYB status


        **Next Step:** Use the party ID to create an account.

        '
      operationId: listParties
      parameters:
      - name: partyType
        in: query
        description: Filter by party type
        schema:
          $ref: '#/components/schemas/PartyType'
        example: INDIVIDUAL
      - name: status
        in: query
        description: Filter by party status
        schema:
          $ref: '#/components/schemas/PartyStatus'
        example: ACTIVE
      - name: externalId
        in: query
        description: Filter by external ID (exact match)
        schema:
          type: string
        example: user-12345
      - $ref: '#/components/parameters/SortOn'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: List of parties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyListResponse'
              example:
                success: true
                result:
                - id: 7e3b9c2a-1f4d-4a8b-9c11-2d6e8f0a1b22
                  externalId: user-12345
                  partyType: INDIVIDUAL
                  status: ACTIVE
                  firstName: Jane
                  lastName: Doe
                  createdAt: '2026-01-15T09:30:00'
                pagination:
                  pageNumber: 1
                  pageSize: 20
                  numberOfElements: 1
                  numberOfPages: 1
                  hasNextPage: false
                  hasPreviousPage: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Parties
      summary: Create a new party
      description: '**Step 1 of the Finance API Flow**


        Creates a new party (Individual or Organisation). This is the first step in onboarding a customer
        or organization to the Finance platform.


        **Party Types:**

        - **INDIVIDUAL**: Natural persons. Requires firstName, lastName.

        - **ORGANISATION**: Companies or businesses. Requires name, optionally vatNumber.


        **Next Step:** Use the returned party ID to create an account.

        '
      operationId: createParty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequest'
            example:
              partyType: INDIVIDUAL
              externalId: user-12345
              firstName: Jane
              lastName: Doe
              address:
                addressLine1: 1 Example Street
                city: Amsterdam
                postalCode: 1011AB
                country: NL
      responses:
        '201':
          description: Party created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePartyResponse'
              example:
                success: true
                result:
                  id: 7e3b9c2a-1f4d-4a8b-9c11-2d6e8f0a1b22
                  externalId: user-12345
                  partyType: INDIVIDUAL
                  status: ACTIVE
                  firstName: Jane
                  lastName: Doe
                  address:
                    addressLine1: 1 Example Street
                    city: Amsterdam
                    postalCode: 1011AB
                    country: NL
                  createdAt: '2026-01-15T09:30:00'
                  updatedAt: '2026-01-15T09:30:00'
                  version: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /parties/{partyId}:
    get:
      tags:
      - Parties
      summary: Get party details
      description: 'Retrieves detailed information about a specific party by ID.


        **Returns:**

        - Complete party information including personal/organization details

        - Current KYC/KYB status

        - Address information

        - Party status (ACTIVE, SUSPENDED, BLOCKED)

        '
      operationId: getParty
      parameters:
      - $ref: '#/components/parameters/PartyId'
      responses:
        '200':
          description: Party details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePartyResponse'
              example:
                success: true
                result:
                  id: 7e3b9c2a-1f4d-4a8b-9c11-2d6e8f0a1b22
                  externalId: user-12345
                  partyType: INDIVIDUAL
                  status: ACTIVE
                  firstName: Jane
                  lastName: Doe
                  kycStatus: VERIFIED
                  address:
                    addressLine1: 1 Example Street
                    city: Amsterdam
                    postalCode: 1011AB
                    country: NL
                  createdAt: '2026-01-15T09:30:00'
                  updatedAt: '2026-01-15T09:30:00'
                  version: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Parties
      summary: Update party details
      description: 'Updates an existing party''s information. Only provided fields will be updated.


        **For Individuals:** Can update firstName, lastName, and address

        **For Organisations:** Can update name, vatNumber, and address


        **Optimistic locking:** You must send the current `version` of the party. If the

        version is stale the request fails with `409 concurrent-modification` — re-fetch and retry.


        **Note:** Cannot change partyType after creation. KYC/KYB status is managed separately.

        '
      operationId: updateParty
      parameters:
      - $ref: '#/components/parameters/PartyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyRequest'
            example:
              version: 0
              firstName: Janet
              lastName: Doe
      responses:
        '200':
          description: Party updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePartyResponse'
              example:
                success: true
                result:
                  id: 7e3b9c2a-1f4d-4a8b-9c11-2d6e8f0a1b22
                  externalId: user-12345
                  partyType: INDIVIDUAL
                  status: ACTIVE
                  firstName: Janet
                  lastName: Doe
                  address:
                    addressLine1: 1 Example Street
                    city: Amsterdam
                    postalCode: 1011AB
                    country: NL
                  createdAt: '2026-01-15T09:30:00'
                  updatedAt: '2026-01-15T09:30:00'
                  version: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Parties
      summary: Delete party
      description: 'Permanently deletes a party. Only allowed when:

        - Party has no associated accounts

        - Party is not in a blocked status

        '
      operationId: deleteParty
      parameters:
      - $ref: '#/components/parameters/PartyId'
      responses:
        '204':
          description: Party deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accounts:
    get:
      tags:
      - Accounts
      summary: List all accounts
      operationId: listAccounts
      parameters:
      - name: externalId
        in: query
        description: Filter by external ID (exact match)
        schema:
          type: string
        example: user-12345
      - name: status
        in: query
        description: Filter by account status
        schema:
          $ref: '#/components/schemas/AccountStatus'
        example: ACTIVE
      - $ref: '#/components/parameters/SortOn'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
              example:
                success: true
                result:
                - id: b2a1f0e9-8c7d-4e3a-9f21-0a1b2c3d4e5f
                  externalId: user-12345
                  name: Jane Doe — Main
                  kycStatus: VERIFIED
                  status: ACTIVE
                  createdAt: '2026-01-15T09:30:00'
                  version: 0
                pagination:
                  pageNumber: 1
                  pageSize: 20
                  numberOfElements: 1
                  numberOfPages: 1
                  hasNextPage: false
                  hasPreviousPage: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Accounts
      summary: Create a new account
      description: 'Creates a new account and auto-provisions a custodial wallet on the specified chain.


        **Party Association:**

        - Provide `partyId` to associate with an existing party

        - Provide `party` object to create a new party inline (Individual or Organisation)

        - The party is associated as ACCOUNT_HOLDER


        When creating a party inline, specify `partyType: INDIVIDUAL` with firstName/lastName,

        or `partyType: ORGANISATION` with name/vatNumber.


        **SELF_CUSTODY companies** must supply the wallet `address`; VENLY_MANAGED companies

        leave it blank and Venly generates the wallet.

        '
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              externalId: user-12345
              name: Jane Doe — Main
              chain: BASE
              address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
              partyId: 7e3b9c2a-1f4d-4a8b-9c11-2d6e8f0a1b22
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAccountResponse'
              example:
                success: true
                result:
                  id: b2a1f0e9-8c7d-4e3a-9f21-0a1b2c3d4e5f
                  externalId: user-12345
                  name: Jane Doe — Main
                  kycStatus: VERIFICATION_PENDING
                  status: ACTIVE
                  createdAt: '2026-01-15T09:30:00'
                  version: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accounts/{accountId}:
    get:
      tags:
      - Accounts
      summary: Get account details
      operationId: getAccount
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleAccountResponse'
              example:
                success: true
                result:
                  id: b2a1f0e9-8c7d-4e3a-9f21-0a1b2c3d4e5f
                  externalId: user-12345
                  name: Jane Doe — Main
                  kycStatus: VERIFIED
                  status: ACTIVE
                  createdAt: '2026-01-15T09:30:00'
                  version: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accounts/{accountId}/party-roles:
    get:
      tags:
      - Accounts
      summary: List party roles for an account
      description: Returns all parties associated with this account and their roles.
      operationId: listPartyRoles
      parameters:
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: List of party roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyRoleListResponse'
              example:
                success: true
                result:
                - partyId: 7e3b9c2a-1f4d-4a8b-9c11-2d6e8f0a1b22
                  roleType: ACCOUNT_HOLDER
                  status: ACTIVE
                  createdAt: '2026-01-15T09:30:00'
                  updatedAt: '2026-01-15T09:30:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Accounts
      summary: Add a party to an account
      description: 'Associates an existing party with this account in a specific role.

        A party can only have one role per account.

        '
      operationId: addPartyRole
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPartyRoleRequest'
            example:
              partyId: 7e3b9c2a-1f4d-4a8b-9c11-2d6e8f0a1b22
              roleType: ACCOUNT_HOLDER
      responses:
        '201':
          description: Party role added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePartyRoleResponse'
              example:
                success: true
                result:
                  partyId: 7e3b9c2a-1f4d-4a8b-9c11-2d6e8f0a1b22
                  roleType: ACCOUNT_HOLDER
                  status: ACTIVE
                  createdAt: '2026-01-15T09:30:00'
                  updatedAt: '2026-01-15T09:30:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accounts/{accountId}/party-roles/{partyId}:
    delete:
      tags:
      - Accounts
      summary: Remove a party from an account
      description: 'Removes a party''s role from this account.

        Cannot remove the last ACCOUNT_HOLDER from an account.

        '
      operationId: removePartyRole
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: partyId
        in: path
        required: true
        description: The party ID to remove from the account
        schema:
          type: string
          format: uuid
        example: 7e3b9c2a-1f4d-4a8b-9c11-2d6e8f0a1b22
      responses:
        '204':
          description: Party role removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accounts/{accountId}/wallets:
    get:
      tags:
      - Wallets
      summary: List wallets for an account
      description: 'Lists the custodial wallets bound to an account, each with its per-asset balances

        (total / available / reserved) and AML screening status.

        '
      operationId: listWallets
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: List of wallets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletListResponse'
              example:
                success: true
                result:
                - id: 9f8e7d6c-5b4a-4938-8271-6a5b4c3d2e1f
                  chain: BASE
                  type: SELF_CUSTODY
                  address: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'
                  balances:
                  - asset: USDC
                    contractAddress: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
                    amount:
                      total: '125.00'
                      available: '100.00'
                      reserved: '25.00'
                  amlStatus: APPROVED
                pagination:
                  pageNumber: 1
                  pageSize: 20
                  numberOfElements: 1
                  numberOfPages: 1
                  hasNextPage: false
                  hasPreviousPage: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accounts/{accountId}/virtual-bank-accounts:
    get:
      tags:
      - Virtual Bank Accounts
      summary: List virtual bank accounts
      operationId: listVirtualBankAccounts
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SortOn'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: List of virtual bank accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualBankAccountListResponse'
              example:
                success: true
                result:
                - id: 4d5e6f70-8192-4a3b-9c4d-5e6f7081920a
                  accountId: b2a1f0e9-8c7d-4e3a-9f21-0a1b2c3d4e5f
                  bankAccountType: EUR_SEPA
                  name: EUR Payouts
                  status: ACTIVE
                  currency: EUR
                  targetCryptocurrency: USDC
                  iban: DE89370400440532013000
                  bic: DEUTDEDB
                  bankName: Example Bank
                  beneficiaryName: Jane Doe
                  referenceCode: VFY-7K2Q-931
                  createdAt: '2026-01-15T09:30:00'
                  updatedAt: '2026-01-15T09:30:00'
                pagination:
                  pageNumber: 1
                  pageSize: 20
                  numberOfElements: 1
                  numberOfPages: 1
                  hasNextPage: false
                  hasPreviousPage: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Virtual Bank Accounts
      summary: Create a virtual bank account
      description: 'Creates a virtual bank account for the specified account.


        The client provides a display name, the fiat currency to receive (inCurrency), and the

        target cryptocurrency for conversion. The backend provisions the appropriate bank

        account based on the currency.


        **Requires** the account to be KYC `VERIFIED`.


        **Currently supported:** EUR (provisions a EUR_SEPA account returning IBAN/BIC).

        '
      operationId: createVirtualBankAccount
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualBankAccountRequest'
            example:
              name: EUR Payouts
              inCurrency: EUR
              targetCryptocurrency: USDC
              idempotencyKey: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '201':
          description: Virtual bank account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleVirtualBankAccountResponse'
              example:
                success: true
                result:
                  id: 4d5e6f70-8192-4a3b-9c4d-5e6f7081920a
                  accountId: b2a1f0e9-8c7d-4e3a-9f21-0a1b2c3d4e5f
                  bankAccountType: EUR_SEPA
                  name: EUR Payouts
                  status: ACTIVE
                  currency: EUR
                  targetCryptocurrency: USDC
                  iban: DE89370400440532013000
                  bic: DEUTDEDB
                  bankName: Example Bank
                  beneficiaryName: Jane Doe
                  referenceCode: VFY-7K2Q-931
                  createdAt: '2026-01-15T09:30:00'
                  updatedAt: '2026-01-15T09:30:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accounts/{accountId}/virtual-bank-accounts/{virtualBankAccountId}:
    get:
      tags:
      - Virtual Bank Accounts
      summary: Get virtual bank account details
      operationId: getVirtualBankAccount
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/VirtualBankAccountId'
      responses:
        '200':
          description: Virtual bank account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleVirtualBankAccountResponse'
              example:
                success: true
                result:
                  id: 4d5e6f70-8192-4a3b-9c4d-5e6f7081920a
                  accountId: b2a1f0e9-8c7d-4e3a-9f21-0a1b2c3d4e5f
                  bankAccountType: EUR_SEPA
                  name: EUR Payouts
                  status: ACTIVE
                  currency: EUR
                  targetCryptocurrency: USDC
                  iban: DE89370400440532013000
                  bic: DEUTDEDB
                  bankName: Example Bank
                  beneficiaryName: Jane Doe
                  referenceCode: VFY-7K2Q-931
                  createdAt: '2026-01-15T09:30:00'
                  updatedAt: '2026-01-15T09:30:00'
        '401':
