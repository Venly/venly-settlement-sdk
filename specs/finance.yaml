            items:
              $ref: '#/components/schemas/PartyRole'
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: string
        name:
          type: string
          description: Display name for the account
        kycStatus:
          $ref: '#/components/schemas/KycStatus'
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Optimistic-locking version
    CreateAccountRequest:
      type: object
      required:
      - externalId
      - chain
      description: 'Create a new account. You can either:

        - Reference an existing party by providing `partyId`

        - Create a new party inline by providing the `party` object


        SELF_CUSTODY companies must also supply the wallet `address`.

        '
      properties:
        externalId:
          type: string
          minLength: 1
          description: Unique external reference for this account
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: Display name for the account
        chain:
          $ref: '#/components/schemas/BlockchainNetwork'
        address:
          type: string
          description: Wallet address. Required for SELF_CUSTODY companies
        partyId:
          type: string
          format: uuid
          description: ID of an existing party to associate as account holder
        party:
          $ref: '#/components/schemas/CreatePartyRequest'
        cardProviderReference:
          $ref: '#/components/schemas/CardProviderReference'
      example:
        externalId: user-12345
        name: John Doe Account
        chain: BASE
        party:
          partyType: INDIVIDUAL
          firstName: John
          lastName: Doe
          address:
            addressLine1: 123 Main Street
            city: Amsterdam
            postalCode: 1012AB
            country: NL
    SingleAccountResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          result:
            $ref: '#/components/schemas/Account'
    AccountListResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          result:
            type: array
            items:
              $ref: '#/components/schemas/Account'
          pagination:
            $ref: '#/components/schemas/Pagination'
    CryptoBalance:
      type: object
      description: Balance breakdown for a single asset, as decimal strings
      properties:
        total:
          type: string
        available:
          type: string
        reserved:
          type: string
    TokenBalance:
      type: object
      properties:
        asset:
          type: string
          description: Asset symbol (e.g. USDC)
        contractAddress:
          type: string
          description: ERC-20 contract address of the asset
        amount:
          $ref: '#/components/schemas/CryptoBalance'
    Wallet:
      type: object
      properties:
