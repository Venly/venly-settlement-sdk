components:
  schemas:
    ApiKeyAuthenticationMethod:
      allOf:
        - $ref: "#/components/schemas/WebhookAuthenticationMethod"
        - type: object
          properties:
            headerName:
              type: string
              maxLength: 255
              minLength: 0
            apiKey:
              type: string
              maxLength: 2048
              minLength: 0
              writeOnly: true
      required:
        - apiKey
        - headerName
    BasicAuthenticationMethod:
      allOf:
        - $ref: "#/components/schemas/WebhookAuthenticationMethod"
        - type: object
          properties:
            username:
              type: string
              maxLength: 255
              minLength: 0
            password:
              type: string
              maxLength: 255
              minLength: 0
              writeOnly: true
      required:
        - password
        - username
    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          maxLength: 2048
          minLength: 0
          pattern: ^https://.+
        name:
          type: string
          maxLength: 255
          minLength: 0
        authenticationMethod:
          oneOf:
            - $ref: "#/components/schemas/ApiKeyAuthenticationMethod"
            - $ref: "#/components/schemas/BasicAuthenticationMethod"
      required:
        - authenticationMethod
        - url
    WebhookAuthenticationMethod:
      type: object
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          enum:
            - API_KEY
            - BASIC_AUTHENTICATION
    WebhookDto:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        name:
          type: string
        authenticationMethod:
          oneOf:
            - $ref: "#/components/schemas/ApiKeyAuthenticationMethod"
            - $ref: "#/components/schemas/BasicAuthenticationMethod"
        status:
          type: string
          enum:
            - ACTIVE
    CreateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          maxLength: 2048
          minLength: 0
          pattern: ^https://.+
        name:
          type: string
          maxLength: 255
          minLength: 0
        authenticationMethod:
          oneOf:
            - $ref: "#/components/schemas/ApiKeyAuthenticationMethod"
            - $ref: "#/components/schemas/BasicAuthenticationMethod"
      required:
        - authenticationMethod
        - url
    BatchItemFailure:
      type: object
      properties:
        index:
          type: integer
          format: int32
        idempotencyKey:
          type: string
        paymentRequestReference:
          $ref: "#/components/schemas/Reference"
        status:
          type: integer
          format: int32
        code:
          type: string
        message:
          type: string
    CardProvider:
      type: object
      properties:
        type:
          type: string
        referenceId:
          type: string
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        failures:
          type: array
          items:
            $ref: "#/components/schemas/BatchItemFailure"
    Pagination:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int64
        numberOfPages:
          type: integer
          format: int32
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    Reference:
      type: object
      properties:
        cardProviderReference:
          $ref: "#/components/schemas/CardProvider"
        externalId:
          type: string
    ResponseEnvelopeVoid:
      type: object
      properties:
