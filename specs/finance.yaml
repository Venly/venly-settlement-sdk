  /payment-requests/{paymentRequestId}/settlements:
    post:
      tags:
      - Payment Requests
      summary: Settle a payment request
      description: 'Finalises a payment request: the settled amount moves from escrow to the company''s
        settlement wallet. The call returns immediately with `status: SETTLING` and the settlement `executions`
        in `PENDING`; the request reaches its terminal `SETTLED` state once those transfers confirm on-chain.


        `amount` is the final settlement figure in the authorized fiat `currency`, and the executions
        follow from how it compares to the authorized amount:


        - Equal to the authorized amount: one `SETTLEMENT` execution.

        - Below the authorized amount: a `SETTLEMENT` plus a `REFUND` that returns the difference from
        escrow to the account wallet.

        - Above the authorized amount: the full escrow settles, plus a `SETTLEMENT_OVERAGE` that collects
        the extra from the account wallet.


        Pass a unique `idempotencyKey`. Sending the same key with the same body again returns the original
        result.

        '
      operationId: settlePaymentRequest
      parameters:
      - $ref: '#/components/parameters/PaymentRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlePaymentRequestInput'
            example:
              amount: 25
              currency: USD
              idempotencyKey: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      responses:
        '202':
          description: Settlement accepted; on-chain processing is asynchronous
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePaymentRequestResponse'
              example:
                success: true
                result:
                  id: d4e5f6a7-b8c9-4012-8345-6789abcdef01
                  accountId: b2a1f0e9-8c7d-4e3a-9f21-0a1b2c3d4e5f
                  amount:
                    fiat: 25
                    crypto: '25.000000'
                  settlementAmount:
                    fiat: 25
                    crypto: '25.000000'
                  currency: USD
                  externalId: order-67890
                  status: SETTLING
                  executions:
                  - id: a7b8c9d0-e1f2-4345-b678-9abcdef01234
                    walletPairId: f6a7b8c9-d0e1-4234-a567-89abcdef0123
                    type: SETTLEMENT
                    chain: BASE
                    asset: USDC
                    amount: 25
                    exchangeRate: 1
                    status: PENDING
                    createdAt: '2026-01-15T10:00:00Z'
                    updatedAt: '2026-01-15T10:00:00Z'
                  createdAt: '2026-01-15T09:30:00Z'
                  updatedAt: '2026-01-15T10:00:00Z'
        '400':
