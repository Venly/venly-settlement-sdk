name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check
      - run: npm test   # builds ESM + CJS, then runs the full node:test suite

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The committed registry JSON under ui/r/ is generated; fail on drift.
      - run: npm run build:registry && git diff --exit-code -- r

  example-mock-bank:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/mock-bank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The example imports the ui kit's source in place (../../ui/registry),
      # and those files resolve react/@venlyfinance/* from ui/node_modules.
      - run: npm ci
        working-directory: ui
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  settlement-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: settlement-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm test   # node:test suite, mocked client, zero network
      - run: npm run build
